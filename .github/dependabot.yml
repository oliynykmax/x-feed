version: 2

updates:
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 1
    open-pull-requests-limit: 1
    groups:
      all-dependencies:
        applies-to: version-updates
        patterns:
          - "*"
      all-security-dependencies:
        applies-to: security-updates
        patterns:
          - "*"
